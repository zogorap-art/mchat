          cat > 'android/app/src/main/java/uz/mchat/app/IncomingCallActivity.java' <<'MCHAT_EOF_3'
          package uz.mchat.app;

          import android.app.Activity;
          import android.app.KeyguardManager;
          import android.app.NotificationManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class IncomingCallActivity extends Activity {

              static final String ACTION_END = "uz.mchat.app.CALL_END";

              private final Handler handler = new Handler(Looper.getMainLooper());
              private BroadcastReceiver endReceiver;

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private TextView roundButton(String symbol, int color) {
                  TextView t = new TextView(this);
                  t.setText(symbol);
                  t.setTextSize(28);
                  t.setTextColor(Color.WHITE);
                  t.setGravity(Gravity.CENTER);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setShape(GradientDrawable.OVAL);
                  bg.setColor(color);
                  t.setBackground(bg);
                  return t;
              }

              private LinearLayout buttonColumn(TextView round, String label) {
                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setGravity(Gravity.CENTER_HORIZONTAL);
                  LinearLayout.LayoutParams rp = new LinearLayout.LayoutParams(dp(72), dp(72));
                  col.addView(round, rp);
                  TextView lab = new TextView(this);
                  lab.setText(label);
                  lab.setTextColor(Color.WHITE);
                  lab.setTextSize(14);
                  lab.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  lp.topMargin = dp(10);
                  col.addView(lab, lp);
                  return col;
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= 27) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                  } else {
                      getWindow().addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED
                              | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON
                              | WindowManager.LayoutParams.FLAG_DISMISS_KEYGUARD);
                  }
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  String name = getIntent().getStringExtra("name");
                  if (name == null || name.length() == 0) {
                      name = "M-CHAT";
                  }
                  boolean video = getIntent().getBooleanExtra("video", false);

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.parseColor("#1C1C1E"));

                  LinearLayout center = new LinearLayout(this);
                  center.setOrientation(LinearLayout.VERTICAL);
                  center.setGravity(Gravity.CENTER_HORIZONTAL);

                  TextView avatar = new TextView(this);
                  avatar.setText(name.substring(0, 1).toUpperCase());
                  avatar.setTextSize(72);
                  avatar.setTypeface(Typeface.DEFAULT_BOLD);
                  avatar.setTextColor(Color.WHITE);
                  avatar.setGravity(Gravity.CENTER);
                  GradientDrawable abg = new GradientDrawable();
                  abg.setShape(GradientDrawable.OVAL);
                  abg.setColor(Color.parseColor("#4C9A2A"));
                  avatar.setBackground(abg);
                  center.addView(avatar, new LinearLayout.LayoutParams(dp(180), dp(180)));

                  TextView nameView = new TextView(this);
                  nameView.setText(name);
                  nameView.setTextColor(Color.WHITE);
                  nameView.setTextSize(30);
                  nameView.setTypeface(Typeface.DEFAULT_BOLD);
                  nameView.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams np = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  np.topMargin = dp(28);
                  center.addView(nameView, np);

                  TextView status = new TextView(this);
                  status.setText(video ? "Kiruvchi video qo'ng'iroq..." : "Kiruvchi ovozli qo'ng'iroq...");
                  status.setTextColor(Color.parseColor("#CCFFFFFF"));
                  status.setTextSize(16);
                  status.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams sp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  sp.topMargin = dp(8);
                  center.addView(status, sp);

                  FrameLayout.LayoutParams cp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.CENTER);
                  cp.bottomMargin = dp(60);
                  root.addView(center, cp);

                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER);
                  row.setWeightSum(2f);

                  TextView decline = roundButton("\u2715", Color.parseColor("#EA4335"));
                  TextView accept = roundButton("\u260E", Color.parseColor("#25D366"));
                  LinearLayout declineCol = buttonColumn(decline, "Rad etish");
                  LinearLayout acceptCol = buttonColumn(accept, "Qabul qilish");
                  row.addView(declineCol, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));
                  row.addView(acceptCol, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  FrameLayout.LayoutParams rp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM);
                  rp.bottomMargin = dp(56);
                  root.addView(row, rp);

                  setContentView(root);

                  decline.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          cancelNotification();
                          finish();
                      }
                  });
                  accept.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          acceptCall();
                      }
                  });

                  endReceiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          finish();
                      }
                  };
                  IntentFilter f = new IntentFilter(ACTION_END);
                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(endReceiver, f, Context.RECEIVER_NOT_EXPORTED);
                  } else {
                      registerReceiver(endReceiver, f);
                  }

                  handler.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          cancelNotification();
                          finish();
                      }
                  }, 45000);
              }

              private void cancelNotification() {
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) {
                      nm.cancel(MChatMessagingService.ID_CALL);
                  }
              }

              private void launchApp() {
                  Intent i = new Intent(this, MainActivity.class);
                  i.putExtra("accept", true);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  startActivity(i);
                  finish();
              }

              private void acceptCall() {
                  cancelNotification();
                  if (Build.VERSION.SDK_INT >= 26) {
                      KeyguardManager km = (KeyguardManager) getSystemService(Context.KEYGUARD_SERVICE);
                      if (km != null && km.isKeyguardLocked()) {
                          km.requestDismissKeyguard(this, new KeyguardManager.KeyguardDismissCallback() {
                              @Override
                              public void onDismissSucceeded() {
                                  launchApp();
                              }

                              @Override
                              public void onDismissCancelled() {
                                  // foydalanuvchi ekranni ochmadi
                              }

                              @Override
                              public void onDismissError() {
                                  launchApp();
                              }
                          });
                          return;
                      }
                  }
                  launchApp();
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacksAndMessages(null);
                  if (endReceiver != null) {
                      try {
                          unregisterReceiver(endReceiver);
                      } catch (Exception e) {
                          // ignore
                      }
                  }
                  super.onDestroy();
              }
          }
