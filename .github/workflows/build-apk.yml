          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">@color/brand</item>
                  <item name="colorPrimary">@color/brand</item>
                  <item name="colorPrimaryDark">@color/brand</item>
              </style>
              <style name="CallTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/call_bg</item>
                  <item name="android:statusBarColor">@color/call_bg</item>
                  <item name="android:navigationBarColor">@color/call_bg</item>
              </style>
          </resources>
          MCHAT_EOF_8
          cat > 'android/build.gradle' <<'MCHAT_EOF_9'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          MCHAT_EOF_9
          cat > 'android/gradle.properties' <<'MCHAT_EOF_10'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          MCHAT_EOF_10
          cat > 'android/settings.gradle' <<'MCHAT_EOF_11'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "mchat"
          include ':app'
          MCHAT_EOF_11
          cp icon-192.png android/app/src/main/res/drawable/ic_launcher.png

      - name: google-services.json ni yozish
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GSJ" ]; then
            echo "XATO: GOOGLE_SERVICES_JSON secret kiritilmagan"
            exit 1
          fi
          printf '%s' "$GSJ" > android/app/google-services.json

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK yig'ish
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK ni faylga chiqarish
        uses: actions/upload-artifact@v4
        with:
          name: M-CHAT-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Releases bo'limiga joylash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk M-CHAT.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest M-CHAT.apk --title "M-CHAT Android" --notes "M-CHAT Android ilovasi (APK). Telefonga yuklab o'rnating."
