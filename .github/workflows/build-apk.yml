          cat > 'android/app/src/main/java/uz/mchat/app/MainActivity.java' <<'MCHAT_EOF_5'
          package uz.mchat.app;

          import android.Manifest;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;

          import com.google.android.gms.tasks.OnCompleteListener;
          import com.google.android.gms.tasks.Task;
          import com.google.androidbrowserhelper.trusted.LauncherActivity;
          import com.google.firebase.messaging.FirebaseMessaging;

          public class MainActivity extends LauncherActivity {

              static final String PREFS = "mchat";
              private static final int REQ_NOTIF = 77;

              private final Handler handler = new Handler(Looper.getMainLooper());
              private boolean notifAsked = false;
              private boolean waitingSettings = false;
              private boolean launching = false;
              private boolean twaStarted = false;

              @Override
              protected boolean shouldLaunchImmediately() {
                  return false;
              }

              @Override
              protected Uri getLaunchingUrl() {
                  Uri base = super.getLaunchingUrl();
                  Uri.Builder b = base.buildUpon();
                  b.appendQueryParameter("src", "apk");
                  SharedPreferences sp = getSharedPreferences(PREFS, MODE_PRIVATE);
                  String token = sp.getString("fcm", null);
                  if (token != null && token.length() > 0) {
                      b.appendQueryParameter("fcm", token);
                  }
                  if (getIntent() != null && getIntent().getBooleanExtra("accept", false)) {
                      b.appendQueryParameter("accept", "1");
                  }
                  return b.build();
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  proceed();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (waitingSettings) {
                      waitingSettings = false;
                      proceed();
                  }
              }

              private void proceed() {
                  if (launching) {
                      return;
                  }
                  if (Build.VERSION.SDK_INT >= 33 && !notifAsked
                          && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      notifAsked = true;
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, REQ_NOTIF);
                      return;
                  }
                  SharedPreferences sp = getSharedPreferences(PREFS, MODE_PRIVATE);
                  if (Build.VERSION.SDK_INT >= 34) {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null && !nm.canUseFullScreenIntent() && !sp.getBoolean("fsiAsked", false)) {
                          sp.edit().putBoolean("fsiAsked", true).apply();
                          try {
                              waitingSettings = true;
                              startActivity(new Intent(Settings.ACTION_MANAGE_APP_USE_FULL_SCREEN_INTENT,
                                      Uri.parse("package:" + getPackageName())));
                              return;
                          } catch (Exception e) {
                              waitingSettings = false;
                          }
                      }
                  }
                  launching = true;
                  fetchTokenAndLaunch();
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQ_NOTIF) {
                      proceed();
                  }
              }

              private void startTwaOnce() {
                  if (twaStarted) {
                      return;
                  }
                  twaStarted = true;
                  launchTwa();
              }

              private void fetchTokenAndLaunch() {
                  handler.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          startTwaOnce();
                      }
                  }, 4000);
                  try {
                      FirebaseMessaging.getInstance().getToken().addOnCompleteListener(new OnCompleteListener<String>() {
                          @Override
                          public void onComplete(Task<String> task) {
                              if (task.isSuccessful() && task.getResult() != null) {
                                  getSharedPreferences(PREFS, MODE_PRIVATE).edit().putString("fcm", task.getResult()).apply();
                              }
                              startTwaOnce();
                          }
                      });
                  } catch (Exception e) {
                      startTwaOnce();
                  }
              }
          }
