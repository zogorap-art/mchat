# M-CHAT Android ilovasini (APK) GitHub'da avtomatik yig'adi.
# Joylashuvi: .github/workflows/build-apk.yml
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android loyihasini yaratish
        run: |
          set -e
          mkdir -p android android/app android/app/src/main android/app/src/main/java/uz/mchat/app android/app/src/main/res/drawable android/app/src/main/res/values
          cat > 'android/app/build.gradle' <<'MCHAT_EOF_0'
          plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'uz.mchat.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'uz.mchat.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.core:core:1.13.1'
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
              implementation platform('com.google.firebase:firebase-bom:33.1.2')
              implementation 'com.google.firebase:firebase-messaging'
          }
          MCHAT_EOF_0
          cat > 'android/app/src/main/AndroidManifest.xml' <<'MCHAT_EOF_1'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
