          cat > 'android/app/src/main/java/uz/mchat/app/MChatMessagingService.java' <<'MCHAT_EOF_4'
          package uz.mchat.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;

          import androidx.core.app.NotificationCompat;

          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;

          import java.util.Map;

          public class MChatMessagingService extends FirebaseMessagingService {

              static final String CH_CALLS = "mchat_calls_v1";
              static final String CH_MSG = "mchat_msgs_v1";
              static final int ID_CALL = 1001;

              @Override
              public void onNewToken(String token) {
                  getSharedPreferences(MainActivity.PREFS, MODE_PRIVATE).edit().putString("fcm", token).apply();
              }

              @Override
              public void onMessageReceived(RemoteMessage message) {
                  Map<String, String> d = message.getData();
                  String kind = d.get("kind");
                  String title = d.get("title");
                  String body = d.get("body");
                  if (title == null || title.length() == 0) {
                      title = "M-CHAT";
                  }
                  createChannels(this);
                  if ("call".equals(kind)) {
                      showCall(title, "1".equals(d.get("video")));
                  } else if ("callend".equals(kind)) {
                      endCall(title);
                  } else {
                      showMessage(title, body == null ? "" : body, d.get("from"));
                  }
              }

              static void createChannels(Context ctx) {
                  if (Build.VERSION.SDK_INT < 26) {
                      return;
                  }
                  NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) {
                      return;
                  }
                  Uri ring = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE);
                  AudioAttributes aa = new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build();

                  NotificationChannel calls = new NotificationChannel(CH_CALLS, "Qo'ng'iroqlar", NotificationManager.IMPORTANCE_HIGH);
                  calls.setDescription("Kiruvchi qo'ng'iroqlar");
                  calls.setSound(ring, aa);
                  calls.enableVibration(true);
                  calls.setVibrationPattern(new long[]{0, 700, 500, 700, 500});
                  calls.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                  nm.createNotificationChannel(calls);

                  NotificationChannel msgs = new NotificationChannel(CH_MSG, "Xabarlar", NotificationManager.IMPORTANCE_HIGH);
                  msgs.setDescription("Yangi xabarlar");
                  msgs.enableVibration(true);
                  msgs.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                  nm.createNotificationChannel(msgs);
              }

              private int piFlags() {
                  int f = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= 23) {
                      f |= PendingIntent.FLAG_IMMUTABLE;
                  }
                  return f;
              }

              private void showCall(String title, boolean video) {
                  Intent full = new Intent(this, IncomingCallActivity.class);
                  full.putExtra("name", title);
                  full.putExtra("video", video);
                  full.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_NO_USER_ACTION);
                  PendingIntent fullPi = PendingIntent.getActivity(this, 1, full, piFlags());

                  Intent acc = new Intent(this, MainActivity.class);
                  acc.putExtra("accept", true);
                  acc.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent accPi = PendingIntent.getActivity(this, 2, acc, piFlags());

                  Intent dec = new Intent(this, CallActionReceiver.class);
                  dec.setAction("uz.mchat.app.DECLINE");
                  PendingIntent decPi = PendingIntent.getBroadcast(this, 3, dec, piFlags());

                  NotificationCompat.Builder nb = new NotificationCompat.Builder(this, CH_CALLS)
                          .setSmallIcon(R.drawable.ic_stat_call)
                          .setContentTitle(title)
                          .setContentText(video ? "Kiruvchi video qo'ng'iroq" : "Kiruvchi ovozli qo'ng'iroq")
                          .setPriority(NotificationCompat.PRIORITY_MAX)
                          .setCategory(NotificationCompat.CATEGORY_CALL)
                          .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                          .setOngoing(true)
                          .setAutoCancel(false)
                          .setTimeoutAfter(45000)
                          .setFullScreenIntent(fullPi, true)
                          .setContentIntent(fullPi)
                          .addAction(0, "Rad etish", decPi)
                          .addAction(0, "Qabul qilish", accPi);
                  Notification n = nb.build();
                  n.flags |= Notification.FLAG_INSISTENT;
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) {
                      nm.notify(ID_CALL, n);
                  }
              }

              private void endCall(String title) {
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) {
                      nm.cancel(ID_CALL);
                  }
                  Intent end = new Intent(IncomingCallActivity.ACTION_END);
                  end.setPackage(getPackageName());
                  sendBroadcast(end);
                  showMessage(title, "O'tkazib yuborilgan qo'ng'iroq", "missed");
              }

              private void showMessage(String title, String body, String from) {
                  Intent open = new Intent(this, MainActivity.class);
                  open.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent pi = PendingIntent.getActivity(this, 4, open, piFlags());
                  NotificationCompat.Builder nb = new NotificationCompat.Builder(this, CH_MSG)
                          .setSmallIcon(R.drawable.ic_stat_call)
                          .setContentTitle(title)
                          .setContentText(body)
                          .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setCategory(NotificationCompat.CATEGORY_MESSAGE)
                          .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                          .setAutoCancel(true)
                          .setContentIntent(pi);
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) {
                      int id = (from == null ? "msg" : from).hashCode();
                      nm.notify(id, nb.build());
                  }
              }
          }
